<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Shopping Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; }
    header { background: #232f3e; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
    .card { background: #fff; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .card .emoji { font-size: 60px; }
    .card h3 { margin: 10px 0 5px; }
    .card button { background: #ff9900; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    .cart { background: #fff; margin: 20px; padding: 15px; border-radius: 8px; }
    .cart li { margin: 5px 0; }
  </style>
</head>
<body>
  <header>
    <h2>🛒 My Online Shop</h2>
    <div>Cart: <span id="count">0</span> items</div>
  </header>

  <div class="products" id="products"></div>

  <div class="cart">
    <h3>Your Cart</h3>
    <ul id="cartList"></ul>
    <p><b>Total: ₹<span id="total">0</span></b></p>
  </div>

  <script>
    const items = [
      { name: "T-Shirt", price: 499, emoji: "👕" },
      { name: "Shoes", price: 1299, emoji: "👟" },
      { name: "Headphones", price: 999, emoji: "🎧" },
      { name: "Watch", price: 1999, emoji: "⌚" },
      { name: "Backpack", price: 799, emoji: "🎒" },
      { name: "Sunglasses", price: 599, emoji: "🕶️" }
    ];
    let cart = [];

    const box = document.getElementById("products");
    items.forEach((p, i) => {
      box.innerHTML += `
        <div class="card">
          <div class="emoji">${p.emoji}</div>
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <button onclick="addToCart(${i})">Add to Cart</button>
        </div>`;
    });

    function addToCart(i) {
      cart.push(items[i]);
      showCart();
    }

    function showCart() {
      document.getElementById("count").innerText = cart.length;
      document.getElementById("cartList").innerHTML =
        cart.map(c => `<li>${c.emoji} ${c.name} - ₹${c.price}</li>`).join("");
      document.getElementById("total").innerText =
        cart.reduce((sum, c) => sum + c.price, 0);
    }
  </script>
</body>
</html>
